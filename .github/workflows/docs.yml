name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default to nothing; only the deploy job gets the write it needs.
permissions: {}

jobs:
  deploy:
    permissions:
      contents: write  # mkdocs gh-deploy pushes to the gh-pages branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install mkdocs-material "mkdocstrings[python]"
      - name: Deploy
        run: mkdocs gh-deploy --force
